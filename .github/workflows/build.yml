name: Build (Linux x86_64 servers, Windows Win32 client)

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
      - "test/**"
      - "port/**"
      - "tools/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-boundaries:
    name: Module Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check module include boundaries
        run: python3 tools/check_boundaries.py

      - name: Self-test the client data converter (synthetic data)
        run: python3 tools/w2_bin_csv.py selftest

      - name: Self-test the WYD Global client data builder (synthetic data)
        run: python3 tools/global_client_data.py selftest

      - name: Self-test the WYD Global server data builder (synthetic data)
        run: python3 tools/global_server_data.py selftest

  mingw-check:
    name: MinGW i686 Cross Check (Linux + wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O espelho do Ubuntu às vezes entrega os ~290 MB de pacotes (mingw + wine32 i386) a ~1 MB/s,
      # o que já levou o passo a mais de 10 min. Os .deb ficam em cache: só a primeira execução
      # (ou uma mudança na lista de pacotes) baixa do espelho.
      - name: Cache apt packages (mingw-w64, wine32, xvfb)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-mingw-wine32-xvfb-${{ runner.os }}-ubuntu24.04-v1

      - name: Install mingw-w64, wine32 and xvfb
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo dpkg --add-architecture i386
          mkdir -p ~/apt-archives/partial
          apt_opts="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Use-Pty=0 -o Dir::Cache::Archives=$HOME/apt-archives"
          for attempt in 1 2 3; do
            echo "tentativa $attempt"
            if sudo -E timeout 600 apt-get $apt_opts update &&
               sudo -E timeout 600 apt-get $apt_opts install -y --no-install-recommends g++-mingw-w64-i686 wine wine32:i386 xvfb; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          du -sh ~/apt-archives
          i686-w64-mingw32-g++ --version | head -n1
          wine --version

      - name: Cross-compile the client, link LoginClient and run the client tests under wine
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: python3 tools/mingw_check.py --jobs 4 --keep "$RUNNER_TEMP/mingw"

      # Servidores Linux com AddressSanitizer e UBSan, que abortam no
      # primeiro erro: os testes e o mesmo teste de jogo, com o LoginClient.exe acima (um cliente
      # Windows no wine) contra DBSrv e TMSrv nativos.
      - name: Build native Linux servers with ASan/UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/linux-asan" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "$RUNNER_TEMP/linux-asan" --parallel 4
          mkdir -p "$RUNNER_TEMP/linux-bin"
          cp "$RUNNER_TEMP/linux-asan/server/dbsrv/DBSrv" "$RUNNER_TEMP/linux-asan/server/tmsrv/TMSrv" "$RUNNER_TEMP/mingw/LoginClient.exe" "$RUNNER_TEMP/linux-bin/"

      - name: Run the tests with ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir "$RUNNER_TEMP/linux-asan" --output-on-failure

      - name: Boot native DBSrv + TMSrv with ASan/UBSan and log in with the Windows client
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          python3 tools/server_boot_smoke.py "$RUNNER_TEMP/linux-bin" --keep "$RUNNER_TEMP/server_boot_linux" --require-login
          # A árvore do teste é a da produção: os nomes dos dados sintéticos batem com os que o código abre.
          python3 tools/linux_deploy.py "$RUNNER_TEMP/server_boot_linux/boot" --check-only

      - name: Upload server boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-logs
          path: |
            ${{ runner.temp }}/server_boot_linux/*/*/Run/Log/
            ${{ runner.temp }}/server_boot_linux/*/*/Run/stderr.log
          if-no-files-found: ignore

  linux-native:
    name: Linux x86_64 native (gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O build que vai para a hospedagem: DBSrv e TMSrv nativos, sem o cliente (DirectX 9). Os
      # avisos acompanhados (os mesmos da checagem mingw) são comparados com a linha de base.
      - name: Build (Release) and compare gcc warnings with the baseline
        run: python3 tools/linux_warning_check.py --build-dir build/linux --jobs 4

      - name: Run unit tests
        run: ctest --test-dir build/linux --output-on-failure

      # Monta a árvore de produção com os binários e confere as unidades do systemd geradas.
      - name: Deploy tree and verify the systemd units
        run: |
          python3 tools/linux_deploy.py "$RUNNER_TEMP/deploy" --bin build/linux
          systemd-analyze verify "$RUNNER_TEMP/deploy/systemd/w2-dbsrv.service" "$RUNNER_TEMP/deploy/systemd/w2-tmsrv.service"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: derust-linux-x86_64
          path: |
            build/linux/server/dbsrv/DBSrv
            build/linux/server/tmsrv/TMSrv

  # Fuzzing da borda de rede (tests/fuzz, libFuzzer com ASan/UBSan): reexecuta as entradas de
  # regressão versionadas e roda 60s por alvo a partir das sementes. Rodadas longas são manuais
  # (tools/fuzz_tmsrv.py --time).
  fuzz:
    name: Fuzz the server network edge (clang, libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the fuzz targets
        run: |
          cmake -S . -B "$RUNNER_TEMP/fuzz" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DDERUST_BUILD_FUZZERS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "$RUNNER_TEMP/fuzz" --parallel 4 --target fuzz_sock_read fuzz_client_message

      - name: Replay the regression inputs
        run: python3 tools/fuzz_tmsrv.py "$RUNNER_TEMP/fuzz" --regress --work "$RUNNER_TEMP/fuzz-work"

      - name: Fuzz each target for 60s
        run: python3 tools/fuzz_tmsrv.py "$RUNNER_TEMP/fuzz" --time 60 --work "$RUNNER_TEMP/fuzz-work"

      - name: Upload crashing inputs and fuzz logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            ${{ runner.temp }}/fuzz-work/crash/
            ${{ runner.temp }}/fuzz-work/log/
          if-no-files-found: ignore

  # Só o cliente: TMProject, o patch do cliente, os testes do cliente e o LoginClient. Os
  # servidores são só Linux (jobs linux-native e mingw-check).
  build-windows:
    name: MSVC Win32 client (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (Win32)
        run: cmake -S . -B build/win32-msvc -A Win32 -DW2PP_BUILD_CLIENT_PATCH=ON

      - name: Build targets (${{ matrix.config }})
        shell: pwsh
        run: |
          $targets = @("ClientPatch_v7662", "TMProject", "tmproject_characterization_tests", "LoginClient")
          $failed = @()
          foreach ($t in $targets) {
            Write-Host "=== Building $t (${{ matrix.config }}) ==="
            $out = & cmake --build build/win32-msvc --config ${{ matrix.config }} --target $t --parallel 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $failed += $t
              $errs = $out | Where-Object { $_ -match "(error [A-Z]+\d+|fatal error)" } | Select-Object -First 10
              foreach ($e in $errs) {
                Write-Host "::error title=$t ($($env:RUNNER_OS))::$e"
              }
              if (-not $errs) {
                Write-Host "::error title=$t::Build exited with code $code"
              }
            }
          }
          if ($failed.Count -gt 0) {
            throw "Failed targets: $($failed -join ', ')"
          }

      - name: Run unit tests (${{ matrix.config }})
        run: ctest --test-dir build/win32-msvc -C ${{ matrix.config }} --output-on-failure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.config }} | Out-Null
          Get-ChildItem -Path build/win32-msvc -Recurse -Include *.exe,*.dll |
            Where-Object { $_.DirectoryName -match "\\${{ matrix.config }}$" -and $_.FullName -notmatch "\\CMakeFiles\\" -and $_.Name -notmatch "_tests\.exe$" } |
            Copy-Item -Destination dist/${{ matrix.config }} -Force
          Get-ChildItem dist/${{ matrix.config }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: derust-win32-${{ matrix.config }}
          path: dist/${{ matrix.config }}/*

name: Build (Windows Win32 MSVC)

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-boundaries:
    name: Module Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check module include boundaries
        run: python3 tools/check_boundaries.py

  mingw-check:
    name: MinGW i686 Cross Check (Linux + wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O espelho do Ubuntu às vezes entrega os ~290 MB de pacotes (mingw + wine32 i386) a ~1 MB/s,
      # o que já levou o passo a mais de 10 min. Os .deb ficam em cache: só a primeira execução
      # (ou uma mudança na lista de pacotes) baixa do espelho.
      - name: Cache apt packages (mingw-w64, wine32, xvfb)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-mingw-wine32-xvfb-${{ runner.os }}-ubuntu24.04-v1

      - name: Install mingw-w64, wine32 and xvfb
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo dpkg --add-architecture i386
          mkdir -p ~/apt-archives/partial
          apt_opts="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Use-Pty=0 -o Dir::Cache::Archives=$HOME/apt-archives"
          for attempt in 1 2 3; do
            echo "tentativa $attempt"
            if sudo -E timeout 600 apt-get $apt_opts update &&
               sudo -E timeout 600 apt-get $apt_opts install -y --no-install-recommends g++-mingw-w64-i686 wine wine32:i386 xvfb; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          du -sh ~/apt-archives
          i686-w64-mingw32-g++ --version | head -n1
          wine --version

      - name: Cross-compile all TUs, link DBSrv/TMSrv and run the tests under wine
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: python3 tools/mingw_check.py --jobs 4 --keep "$RUNNER_TEMP/mingw"

      # Sobe DBSrv e TMSrv com dados sintéticos (prefixo do wine e Xvfb próprios) e faz o login
      # de ponta a ponta com o LoginClient (fontes do cliente).
      - name: Boot DBSrv + TMSrv and log in under wine (synthetic data)
        timeout-minutes: 10
        run: python3 tools/server_boot_smoke.py "$RUNNER_TEMP/mingw" --keep "$RUNNER_TEMP/server_boot" --require-login

      - name: Upload server boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-logs
          path: |
            ${{ runner.temp }}/server_boot/*/srv/*/Log/
            ${{ runner.temp }}/server_boot/*/srv/*/wine.log
          if-no-files-found: ignore

  build-windows:
    name: MSVC Win32 (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (Win32)
        run: cmake -S . -B build/win32-msvc -A Win32 -DW2PP_BUILD_CLIENT_PATCH=ON

      - name: Build targets (${{ matrix.config }})
        shell: pwsh
        run: |
          $targets = @("w2pp_common", "DBSrv", "TMSrv", "ClientPatch_v7662", "TMProject", "w2pp_common_tests", "w2pp_characterization_tests", "tmproject_characterization_tests", "LoginClient")
          $failed = @()
          foreach ($t in $targets) {
            Write-Host "=== Building $t (${{ matrix.config }}) ==="
            $out = & cmake --build build/win32-msvc --config ${{ matrix.config }} --target $t --parallel 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $failed += $t
              $errs = $out | Where-Object { $_ -match "(error [A-Z]+\d+|fatal error)" } | Select-Object -First 10
              foreach ($e in $errs) {
                Write-Host "::error title=$t ($($env:RUNNER_OS))::$e"
              }
              if (-not $errs) {
                Write-Host "::error title=$t::Build exited with code $code"
              }
            }
          }
          if ($failed.Count -gt 0) {
            throw "Failed targets: $($failed -join ', ')"
          }

      - name: Run unit tests (${{ matrix.config }})
        run: ctest --test-dir build/win32-msvc -C ${{ matrix.config }} --output-on-failure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.config }} | Out-Null
          Get-ChildItem -Path build/win32-msvc -Recurse -Include *.exe,*.dll |
            Where-Object { $_.DirectoryName -match "\\${{ matrix.config }}$" -and $_.FullName -notmatch "\\CMakeFiles\\" -and $_.Name -notmatch "_tests\.exe$" } |
            Copy-Item -Destination dist/${{ matrix.config }} -Force
          Get-ChildItem dist/${{ matrix.config }}

      # Mesmo teste de partida do job mingw, agora com os binários MSVC, nativos.
      - name: Boot DBSrv + TMSrv and log in (${{ matrix.config }}, synthetic data)
        timeout-minutes: 10
        run: python tools/server_boot_smoke.py dist/${{ matrix.config }} --keep "${{ runner.temp }}/server_boot" --require-login

      - name: Upload server boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-logs-${{ matrix.config }}
          path: ${{ runner.temp }}/server_boot/*/srv/*/Log/
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: derust-win32-${{ matrix.config }}
          path: dist/${{ matrix.config }}/*

# SSH da VPS do derust (docs/OPS.md): só chave, sem root por senha. Instale em
# /etc/ssh/sshd_config.d/derust.conf, confira com `sudo sshd -t` e recarregue: sudo systemctl reload ssh
# Antes, confirme que a sua chave entra (~/.ssh/authorized_keys), numa segunda sessão aberta.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no

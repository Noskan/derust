# Postgres do w2db (docs/OPS.md). Copie para /etc/postgresql/<versão>/main/conf.d/derust.conf e
# reinicie o Postgres.

# Só o socket local: o w2db e o pgBackRest rodam na mesma máquina.
listen_addresses = ''

# WAL contínuo para o repositório do pgBackRest (fora da VPS). archive_timeout fecha o segmento
# a cada minuto quando houve escrita: é a perda máxima numa restauração (cerca de 1 minuto).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=w2db archive-push %p'
archive_timeout = 60
max_wal_senders = 3

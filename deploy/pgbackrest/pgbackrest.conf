# pgBackRest do w2db (docs/OPS.md). Copie para /etc/pgbackrest/pgbackrest.conf (dono postgres,
# modo 0640). As chaves do bucket e a senha da criptografia ficam fora deste arquivo, em
# /etc/pgbackrest/conf.d/secrets.conf (modo 0600):
#
#   [global]
#   repo1-s3-key=...
#   repo1-s3-key-secret=...
#   repo1-cipher-pass=...
#
# Guarde a repo1-cipher-pass também fora da VPS: sem ela o backup não abre.

[global]
# Bucket S3 compatível fora da VPS (Backblaze B2, Cloudflare R2, Wasabi...).
repo1-type=s3
repo1-path=/derust
repo1-s3-bucket=TROQUE-PELO-BUCKET
repo1-s3-endpoint=TROQUE-PELO-ENDPOINT
repo1-s3-region=TROQUE-PELA-REGIAO
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Quatro backups completos (um por semana) e os diferenciais e o WAL entre eles.
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=detail

[w2db]
pg1-path=/var/lib/postgresql/17/main
pg1-socket-path=/var/run/postgresql
